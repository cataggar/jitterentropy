name: Linux

# Linux user space: the Zig builds across the Ubuntu LTS releases and
# architectures, 32 bit, musl, distributions, sanitizers, fuzzing and coverage.

on:
  push:
    branches: [ zig, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: ${{ matrix.os }}, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every Ubuntu LTS still supported: each brings its own glibc here,
        # and its own kernel headers to linux-kmod and linux-dkms, which use
        # the same list.
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # -Drecording=true: libjitterentropy-record gets record-colink here -
      # the private copy's internal linkage beside libjitterentropy, shared
      # and static. -Drngd=true: jitterentropy-rngd and its rngd-version test.
      # -Dkernel-lib=true: libjitterentropy-kernel and jitter_rng.
      - name: Build
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build \
            -Dlinkage="$linkage" \
            -Drecording=true \
            -Dkernel-lib=true \
            -Drngd=true

      - name: Run unit tests
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build \
            -Dlinkage="$linkage" \
            -Drecording=true \
            -Dkernel-lib=true \
            -Drngd=true \
            test

      - name: Run tests
        run: |
          echo "RLIMIT_MEMLOCK soft=$(ulimit -Sl) hard=$(ulimit -Hl)"
          cpuinfo=./zig-out/bin/jitterentropy-cpuinfo
          "$cpuinfo"
          "$cpuinfo" --json | python3 -c 'import json,sys; json.load(sys.stdin)'
          "$cpuinfo" --summary
          export LD_LIBRARY_PATH="$PWD/zig-out/lib:${LD_LIBRARY_PATH:-}"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linux-32bit:
    name: i686 (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install 32-bit runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386

      - name: Build
        run: zig build -Dtarget=x86-linux-gnu

      - name: Run tests
        run: |
          file zig-out/bin/gcd | grep -q '32-bit' || { echo "not a 32-bit build"; exit 1; }
          zig build -Dtarget=x86-linux-gnu test
          ./zig-out/bin/jitterentropy-cpuinfo
          for opt in "--all-caches" "--force-internal-timer"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  # The only job building the stub half of jitterentropy-timer.c.
  linux-no-internal-timer:
    name: without internal timer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Dinternal-timer=false

      - name: Run tests
        run: |
          zig build -Dinternal-timer=false test
          ./zig-out/bin/jitterentropy-rng 256 > /dev/null

  # acvpparser's jent backend, the CAVP test harness of the conditioner,
  # #includes src/jitterentropy-sha3.c and builds it with -Werror. Unpinned:
  # the current parser is the one that has to keep working.
  linux-acvp-parser:
    name: ACVP parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: smuellerDD/acvpparser
          path: acvpparser

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Show the acvpparser revision
        run: git -C acvpparser log -1 --format='%H %cd %s'

      - name: Build the library
        run: zig build -Dlinkage=static -Dtools=false -Dexport-internals=true

      - name: Build acvpparser against this tree
        run: |
          mkdir -p "$RUNNER_TEMP/jent-src/src" "$RUNNER_TEMP/jent-src/arch"
          ln -sf "$PWD/jitterentropy.h" "$RUNNER_TEMP/jent-src/jitterentropy.h"
          cat > "$RUNNER_TEMP/jent-src/src/jitterentropy-sha3.c" << 'EOF'
          #include "jitterentropy.h"
          #include <stdint.h>
          #include <stddef.h>
          #define JENT_SHA3_256_SIZE_DIGEST 32
          #define JENT_XDRBG_SIZE_STATE 64
          #define JENT_SHA3_256_SIZE_BLOCK 136
          #define JENT_SHA3_MAX_SIZE_BLOCK JENT_SHA3_256_SIZE_BLOCK
          struct jent_sha_ctx {
              uint64_t state[25];
              size_t msg_len;
              uint8_t partial[JENT_SHA3_MAX_SIZE_BLOCK];
              uint8_t xdrbg_block[JENT_XDRBG_SIZE_STATE + JENT_SHA3_256_SIZE_DIGEST];
              uint8_t r;
              uint8_t rword;
              uint8_t digestsize;
              uint8_t padding;
              uint8_t initially_seeded:1;
          };
          #define HASH_CTX_ON_STACK(name) struct jent_sha_ctx name
          void jent_sha3_256_init(struct jent_sha_ctx *ctx);
          void jent_shake256_init(struct jent_sha_ctx *ctx);
          static inline void jent_shake256_set_digestsize(struct jent_sha_ctx *ctx, unsigned int digestsize) {
              ctx->digestsize = (uint8_t)digestsize;
          }
          void jent_sha3_update(struct jent_sha_ctx *ctx, const uint8_t *in, size_t inlen);
          void jent_sha3_final(struct jent_sha_ctx *ctx, uint8_t *digest);
          EOF
          LDFLAGS="$PWD/zig-out/lib/libjitterentropy.a" \
            make -C acvpparser jent JENT_SRC="$RUNNER_TEMP/jent-src" -j "$(nproc)"

      - name: Check its digests against hashlib
        run: |
          python3 .github/scripts/acvp-parser-check.py \
            acvpparser/acvp-parser "$RUNNER_TEMP"

  linux-musl:
    name: musl, ${{ matrix.link }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [ dynamic, static ]
        include:
          - link: dynamic
            expect: ld-musl
          - link: static
            expect: statically linked
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install musl runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y musl binutils

      - name: Build
        run: zig build -Dtarget=x86_64-linux-musl -Dlinkage=${{ matrix.link }}

      - name: Run tests
        run: |
          bin=zig-out/bin/jitterentropy-rng
          file "$bin"

          # Captured before it is searched, as in nix.yml: a failing or
          # silent strings would leave grep nothing to match, and "no GLIBC"
          # would pass vacuously.
          syms=$(strings "$bin")
          if [ -z "$syms" ]; then
            echo "::error::strings printed nothing for $bin"
            exit 1
          fi
          if grep -q GLIBC <<< "$syms"; then
            echo "::error::GLIBC symbol versions present, this is not musl"
            exit 1
          fi

          file "$bin" | grep -q "${{ matrix.expect }}" || {
            echo "::error::expected a ${{ matrix.link }} binary (${{ matrix.expect }})"
            exit 1
          }

          zig build -Dtarget=x86_64-linux-musl -Dlinkage=${{ matrix.link }} test
          ./zig-out/bin/jitterentropy-cpuinfo
          export LD_LIBRARY_PATH="$PWD/zig-out/lib:${LD_LIBRARY_PATH:-}"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linux-distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The RHEL 7 generation (glibc 2.17), pinned at its last
          # minor release; the other entries float.
          - name: CentOS 7
            image: quay.io/centos/centos:centos7.9.2009
          - name: RHEL 8
            image: registry.access.redhat.com/ubi8/ubi:latest
          - name: RHEL 9
            image: registry.access.redhat.com/ubi9/ubi:latest
          - name: RHEL 10
            image: registry.access.redhat.com/ubi10/ubi:latest
          - name: SLES 15 SP7
            image: registry.suse.com/bci/bci-base:15.7
          - name: SLES 16.1
            image: registry.suse.com/bci/bci-base:16.1
          # quay.io: Docker Hub rate-limits anonymous pulls per source IP.
          - name: Arch Linux
            image: quay.io/archlinux/archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - name: Build and test in a ${{ matrix.name }} container
        run: |
          zig_dir=$(dirname "$(command -v zig)")
          docker run --rm -v "$PWD:/src" -v "$zig_dir:/opt/zig:ro" -w /src \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              # No apostrophes anywhere in here: the whole script is a
              # single-quoted argument to bash -c, and one would end it.

              # mirrorlist.centos.org is gone: point CentOS 7 at the vault.
              # gpgcheck stays on with the key the image ships.
              if [ -f /etc/yum.repos.d/CentOS-Base.repo ]; then
                sed -i \
                  -e "s|^mirrorlist=|#mirrorlist=|" \
                  -e "s|^#baseurl=http://mirror.centos.org/centos/\$releasever|baseurl=https://vault.centos.org/7.9.2009|" \
                  /etc/yum.repos.d/CentOS-Base.repo
              fi

              if command -v dnf > /dev/null; then
                install="dnf -y install"
              elif command -v zypper > /dev/null; then
                install="zypper --non-interactive install"
              elif command -v pacman > /dev/null; then
                install="pacman -Sy --noconfirm --needed"
              else
                install="yum -y install"
              fi
              # gawk for the exported-symbols tests: SUSE BCI has no awk.
              # binutils for nm used by check-exports.sh.
              $install gawk binutils

              export PATH=/opt/zig:$PATH
              bash .github/scripts/vm-build-and-test.sh
            '

  sanitizers:
    name: UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build -Dsanitizers=true

      - name: Run unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: zig build -Dsanitizers=true test

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          bin=./zig-out/bin

          run_tolerated() {
            log="$RUNNER_TEMP/sanitizer-run.log"

            if "$@" > /dev/null 2> "$log"; then
              return 0
            fi

            cat "$log"
            if grep -qE 'Sanitizer|runtime error:' "$log"; then
              echo "::error::sanitizer report from: $*"
              exit 1
            fi
            echo "::warning::failed without a sanitizer finding: $*"
          }

          "$bin/jitterentropy-cpuinfo"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$bin/jitterentropy-rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            run_tolerated "$bin/jitterentropy-rng" 256 $opt
          done

          run_tolerated "$bin/jitterentropy-hashtime" \
            1000 2 "$RUNNER_TEMP/hashtime" --force-fips

  thread-sanitizer:
    name: TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # A build of its own, not an addition to the sanitizers job: the thread
      # and the address/UB sanitizer cannot be combined, and a run under one says
      # nothing about the other.
      - name: Build
        run: zig build -Dtsan=true

      # The whole suite rather than unit-concurrency alone: most of it is
      # single threaded and costs nothing to run here, and the two programs
      # that do start the library's own counting thread are the ones the
      # suppression file is about.
      #
      # halt_on_error, so a report fails the test that produced it. Without it
      # the sanitizer counts the race and the suite still exits zero.
      - name: Run the suite under the thread sanitizer
        env:
          TSAN_OPTIONS: handle_segv=0:halt_on_error=1:suppressions=${{ github.workspace }}/tests/tsan.supp
        run: zig build -Dtsan=true test

      # unit-concurrency is the program written for this build, and its threads
      # race whichever way the scheduler puts them - one clean run says less
      # than several. Cheap enough to repeat: it is under a second of work.
      - name: Repeat the concurrency test
        env:
          TSAN_OPTIONS: handle_segv=0:halt_on_error=1:suppressions=${{ github.workspace }}/tests/tsan.supp
        run: |
          for _ in $(seq 1 10); do
            ./zig-out/bin/unit-concurrency > /dev/null
          done

  fuzz:
    name: fuzzing
    runs-on: ubuntu-latest
    # actions: read for the corpus of an earlier run below.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The corpus the last clean run on master kept, so that each run goes
      # on from there rather than from nothing. Taken from the most recent
      # completed run that still has one: a run whose fuzzing failed uploads
      # none, and artifacts expire. None at all is not an error, and neither is
      # a repository whose default branch has no such workflow yet.
      - name: Fetch the corpus of an earlier run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" \
                         --workflow linux.yml --branch master \
                         --status completed --limit 10 \
                         --json databaseId --jq '.[].databaseId' ||
                       true); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                 --name fuzz-corpus --dir . 2>/dev/null; then
              found=$run
              break
            fi
          done
          if [ -n "$found" ]; then
            echo "starting from the corpus of run $found:" \
                 "$(find corpus-health corpus-api -type f 2>/dev/null | wc -l) inputs"
          else
            echo "::notice::no earlier corpus, starting from nothing"
          fi

      # Without the sanitizers: they cost fuzz-api about a factor of ten in
      # executions per second, which is most of what it has. The corpus this
      # run produces is replayed under them below, which finds the same memory
      # errors without paying for them on every mutation.
      - name: Build the search harnesses
        run: zig build -Dfuzzing=true --prefix "$PWD/build-fuzz"

      # Short, and a smoke test rather than a campaign: what it has to catch is
      # a harness that no longer builds or a contract the library stopped
      # holding, not the defect that needs an hour of mutation. -runs is not
      # given, so each stops on its own clock.
      #
      # fuzz-health gets the longer run of the two because it is the one that
      # can search: nothing in it measures the machine's timer.
      # artifacts/ has to exist before libFuzzer is pointed at it: it writes a
      # crash there rather than creating the directory, and refuses to start
      # otherwise.
      - name: Fuzz the health tests
        run: |
          mkdir -p corpus-health artifacts
          ./build-fuzz/bin/fuzz-health \
            -max_total_time=180 -max_len=8192 \
            -artifact_prefix=artifacts/ corpus-health

      - name: Fuzz the public API
        run: |
          mkdir -p corpus-api artifacts
          ./build-fuzz/bin/fuzz-api \
            -max_total_time=120 \
            -artifact_prefix=artifacts/ corpus-api

      # The corpus both runs built, through the same harnesses under the
      # undefined behavior sanitizer. The standalone programs take
      # the inputs as arguments and assert the same contracts.
      - name: Build the replay harnesses
        run: zig build -Dsanitizers=true --prefix "$PWD/build-asan"

      - name: Replay the corpus under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -e
          find corpus-health -type f -print0 |
            xargs -0 -r -n 64 ./build-asan/bin/fuzz-health-standalone \
              > /dev/null
          find corpus-api -type f -print0 |
            xargs -0 -r -n 64 ./build-asan/bin/fuzz-api-standalone \
              > /dev/null

      # Only reached when nothing above crashed, so this is the corpus of a
      # clean run: worth keeping, as the next run starts from it rather than
      # from nothing - see the first step.
      - name: Upload the corpus
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-corpus
          path: |
            corpus-health/
            corpus-api/
          if-no-files-found: warn

      # Anything libFuzzer wrote out - a crash, a timeout, an out-of-memory -
      # is the input needed to reproduce it, and the step above has already
      # failed the job by then.
      - name: Upload the artifacts of a failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install gcovr and llvm-cov
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr llvm
          gcovr --version
          llvm-cov --version

      - name: Build
        run: zig build -Dcoverage=true

      - name: Run unit tests
        run: zig build -Dcoverage=true test

      - name: Generate the HTML coverage report
        run: |
          echo "RLIMIT_MEMLOCK soft=$(ulimit -Sl) hard=$(ulimit -Hl)"
          zig build -Dcoverage=true coverage

      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: zig-out/coverage/
          if-no-files-found: error
