name: BSD

# The BSDs, each in a VM.

on:
  push:
    branches: [ zig, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y bash
            fetch -qo /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-freebsd-0.17.0.tar.xz
            mkdir -p /usr/local/zig
            tar -xJf /tmp/zig.tar.xz -C /usr/local/zig --strip-components=1
            ln -sf /usr/local/zig/zig /usr/local/bin/zig
          run: |
            bash .github/scripts/vm-build-and-test.sh

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg_add -I bash zig
          run: |
            bash .github/scripts/vm-build-and-test.sh

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            /usr/sbin/pkg_add bash zig
          run: |
            bash .github/scripts/vm-build-and-test.sh

  dragonflybsd:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in a DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y bash zig
          run: |
            bash .github/scripts/vm-build-and-test.sh
