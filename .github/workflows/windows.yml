name: Windows

# Windows: MSVC, clang-cl, MinGW and Cygwin.

on:
  push:
    branches: [ zig, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Zig, ${{ matrix.os }}, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build -Dlinkage="$linkage"

      - name: Run tests
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          export PATH="$PWD/zig-out/bin:$PATH"
          zig build -Dlinkage="$linkage" test
          ./zig-out/bin/jitterentropy-cpuinfo.exe
          rng=./zig-out/bin/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  windows-mingw:
    name: MinGW-w64, ${{ matrix.msystem }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc

      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Run tests
        run: |
          zig build -Dtarget=x86_64-windows-gnu test
          ./zig-out/bin/jitterentropy-cpuinfo.exe
          rng=./zig-out/bin/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linking-mingw:
    name: linking, MinGW-w64, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [ 'ON', 'OFF' ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      # Native Windows programs, so their paths go through cygpath.
      - name: Build and install the library
        run: |
          prefix=$(cygpath -m "$PWD/prefix")
          echo "JENT_PREFIX=$prefix" >> "$GITHUB_ENV"
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build -Dtarget=x86_64-windows-gnu -Dlinkage="$linkage" --prefix "$prefix"

      - name: Link and run through pkg-config
        run: |
          export PKG_CONFIG_PATH="$JENT_PREFIX/lib/pkgconfig"
          pkg-config --exists jitterentropy || {
            echo "::error::no jitterentropy.pc under $PKG_CONFIG_PATH"
            exit 1
          }
          # The library itself is in Libs for both kinds of build, so a plain
          # --libs names it even where only the archive is installed. What a
          # plain --libs may lack for a static build is Libs.private, the
          # archive's own dependencies, which is why the link below still uses
          # --static; this is the check that --static alone would hide.
          if ! pkg-config --libs jitterentropy | grep -qw -- -ljitterentropy; then
            echo "::error::pkg-config --libs does not name -ljitterentropy"
            exit 1
          fi
          if [ "${{ matrix.shared }}" = ON ]; then
            libs=$(pkg-config --libs jitterentropy)
          else
            libs=$(pkg-config --static --libs jitterentropy)
          fi
          cflags=$(pkg-config --cflags jitterentropy)
          echo "cflags: $cflags"
          echo "libs:   $libs"
          gcc -std=c11 $cflags tests/linking/jitterentropy-linktest.c $libs \
            -o linktest-pc.exe
          PATH="$PWD/prefix/bin:$PATH" ./linktest-pc.exe

  cygwin:
    name: Cygwin
    runs-on: windows-latest
    steps:
      # Before the checkout: Cygwin's sh trips over CRLF line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            binutils

      - name: Build and test
        run: bash .github/scripts/vm-build-and-test.sh
