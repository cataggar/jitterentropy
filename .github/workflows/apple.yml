name: Apple

# Apple platforms: macOS.

on:
  push:
    branches: [ zig, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  macos:
    name: ${{ matrix.os }}, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15-intel ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build -Dlinkage="$linkage"

      - name: Run tests
        run: |
          linkage=${{ matrix.shared == 'ON' && 'dynamic' || 'static' }}
          zig build -Dlinkage="$linkage" test
          ./zig-out/bin/jitterentropy-cpuinfo
          ./zig-out/bin/jitterentropy-cpuinfo --json > /dev/null
          export DYLD_LIBRARY_PATH="$PWD/zig-out/lib:${DYLD_LIBRARY_PATH:-}"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./zig-out/bin/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done
